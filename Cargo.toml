[package]
name = "vlpds"
version = "1.0.0"
edition = "2021"
description = "An atproto Personal Data Server whose only durable storage is an object store, clustered across any number of nodes"
license = "MIT"
repository = "https://github.com/jazware/vlpds"
readme = "README.md"
keywords = ["atproto", "bluesky", "pds", "object-storage", "s3"]
categories = ["network-programming", "web-programming::http-server"]
publish = false
# tests/ is one binary (tests/all/main.rs), declared below: one link per run
# instead of one per file.
autotests = false

# crates/slate-metrics shares this lockfile and fork patch; vlrelay and
# delta depend on it by path. bench/results holds standalone harnesses.
[workspace]
members = ["crates/slate-metrics"]
exclude = ["bench", "checker-rs", "passkey-differential"]

[features]
default = ["jemalloc", "slatedb-metrics"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# The test binary (benches) on jemalloc, the server's allocator: the system
# allocator costs an export ~1.5x the instructions (DESIGN "Measured")
bench-jemalloc = ["jemalloc"]
# A/B alternative: cargo build --release --no-default-features --features mimalloc
mimalloc = ["dep:mimalloc"]
# CPU profiling (bench/obs/README.md): --pyroscope-url pushes 100 Hz pprof-rs
# samples to a Pyroscope server; GET /debug/pprof/profile (admin) serves one
# on demand. Both use pyroscope's pprof-rs backend (the standalone pprof
# crate's SIGPROF handler symbol collides with it), one at a time.
profiling = ["dep:pyroscope", "dep:prost", "dep:inferno"]
# SlateDB's own stats (block cache hits, memtable, L0, flushes) in /metrics,
# one `db` label per shard (crates/slate-metrics)
slatedb-metrics = ["dep:slate-metrics"]
# TEST ONLY, never in a release image: adds the test feature level
# (src/version.rs TEST_LEVEL = newest real level + 1), which changes the
# segment magic/header and a retain/ report field, so rolling upgrades are
# exercised with a real format change (tests/level_gating.rs, bench/ha
# upgrade-* scenarios, `just upgrade-ci`).
test-level = []

[dependencies]
# zstd/lz4: SST block compression (--sst-compression, default zstd)
slatedb = { version = "0.17", features = ["aws", "wal_disable", "zstd", "lz4"] }
# the SST block cache (partition.rs BlockCache): SlateDB's FoyerCache can't be resized
foyer = "0.22"
# log segment body compression (src/segment.rs; the same zstd SlateDB links)
zstd = "0.13"
# decoding gzip/deflate AppView responses for read-after-write munging (the
# flate2 tower-http already links)
flate2 = "1"
# brotli (`br`) decoding of proxied AppView bodies for read-after-write
brotli-decompressor = "6"
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "http2"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# K-256 signing/verification: libsecp256k1 (vendored C via cc), ~1.7x
# faster signing and ~2.7x faster verification than RustCrypto k256.
secp256k1 = { version = "0.33", features = ["global-context"] }
sha2 = "0.11"
rand = "0.8"
# explicit-slur handle filter (src/handle_policy.rs; the reference's regexes)
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
lru = "0.18"
base64 = "0.23"
hmac = "0.13"
# Spaces LtHash (src/space/lthash.rs): BLAKE3 in XOF mode, as the reference
blake3 = "1"
sha1 = "0.11"
futures = "0.3"
hdrhistogram = "7"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "http2", "rustls", "stream"] }
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls"] }
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"], optional = true }
mimalloc = { version = "0.1", optional = true }
pyroscope = { version = "2.1", default-features = false, features = ["backend-pprof-rs"], optional = true }
prost = { version = "0.14", optional = true }
inferno = { version = "0.12", default-features = false, optional = true }
slate-metrics = { path = "crates/slate-metrics", optional = true }
prometheus = { version = "0.14", default-features = false }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
bs58 = "0.5"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# OAuth (src/oauth): ES256 (P-256) for DPoP proofs, client assertions and access tokens;
# DNS TXT lookups for lexicon authority resolution (include: permission sets).
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
hickory-resolver = "0.26"
# HTTP: server-wide CORS, response compression (json/car) and request
# Content-Encoding decoding, as the reference PDS does.
# grapheme counts for lexicon maxGraphemes (src/lexicon.rs)
unicode-segmentation = "1"
tower = { version = "0.5", features = ["util"] }
# web UI content types (src/xrpc/webui.rs)
mime_guess = "2"
tower-http = { version = "0.6", features = ["compression-gzip", "decompression-gzip", "decompression-deflate"] }
# outbound email (src/mail.rs): async SMTP over rustls (ring, webpki roots), no native-tls
# secrets at rest (src/secrets.rs): XChaCha20-Poly1305 under the local KEK;
# unwrapped key material is zeroized on drop
chacha20poly1305 = "0.11"
zeroize = { version = "1", features = ["derive"] }
# GCP service-account JWTs (RS256) for Cloud KMS tokens (src/secrets.rs);
# already in the tree via rustls
ring = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
# Peer mTLS (src/peer_tls.rs; DESIGN.md "Exposure"): rustls on both ends of
# node-to-node traffic, ring provider (already in the tree via reqwest and
# lettre); rcgen for `vlpds admin tls` (cluster CA, node certs); x509-parser
# reads the node identity (URI SAN) and expiry from certs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
x509-parser = "0.18"
time = { version = "0.3", default-features = false, features = ["std"] }

[[test]]
name = "all"
path = "tests/all/main.rs"

# Argon2 overload shedding: its own binary because it saturates the
# process-wide Argon2 permits (every other login in the process would shed)
[[test]]
name = "argon2_shed"
path = "tests/argon2_shed.rs"

# A fresh node's /metrics exports the counters alerts rely on at 0: its own
# binary because metrics are process-wide (other tests would move them)
[[test]]
name = "fresh_metrics"
path = "tests/fresh_metrics.rs"

# Rolling upgrades with the test feature level: its own binary (the active
# level is process-wide), so `cargo test --features test-level --test level_gating`
[[test]]
name = "level_gating"
path = "tests/level_gating.rs"
required-features = ["test-level"]

# The fork's main = upstream slatedb main at 8c1c6c33 plus the patches listed
# in its PATCHES.md (numbered as there), pinned here by rev (each patch also
# has its own branch for an upstream report, all pending). Upstream fixes
# the two union-clone bugs behind partition.rs's merge regression tests
# (#2132: unique L0 view ids after a split's halves merge back; #2134: the
# writer/compactor L0 merge cuts at the view id, not a shared SST id), so the
# fork's patches 1 and 5 are gone. DESIGN.md "Online shard split/merge",
# "Patched SlateDB".
# 2. a synchronous `next` fast path for resident rows plus DbIterator::next_batch
#    (scan ~12.5k -> ~3.4k instructions/row; getRepo export -57%).
# 3. an admin-submitted compaction (reshard GC's forced detach) skipped the
#    destination check and could be promoted next to a running job into the
#    same sorted run; the executor's assert! then panicked (validate_compaction
#    now fails a submitted spec that collides with a claimed one).
# 4. CompactionWorkerBuilder::with_db_cache: a standalone worker seeds its
#    output SSTs' index and filters into the DB's cache, so a fresh SST isn't
#    a guaranteed metadata miss for its first reads.
# 6. the table store peeks the cache (DbCache::peek_*) before it builds a
#    CacheLoader: every filter/index/stats/block hit built and dropped one,
#    ~10 allocations per SST section a get touches (~16% fewer instructions
#    per cached get in the fork's alloc bench). MetaCache and BlockCache use
#    the default peek, their get_*.
# 7. SafeSender: a send into a channel whose receiving task was dropped
#    without a recorded close result (a runtime shut down under an open DB)
#    returns BackgroundTaskCancelled instead of panicking.
# 8. SplitCache::fetch_block/fetch_index clamp the loaded entry to its own
#    allocation, as insert does: an uncompressed block was a slice of the
#    HTTP read buffer and pinned all of it (vlRelay's seeds: ~1 GB uncounted).
[patch.crates-io]
slatedb = { git = "https://github.com/jazware/slatedb", rev = "9bbeb849e6ead04556c831c50078568ca118903c" }
# the same rev, so the metrics recorder (crates/slate-metrics) and slatedb share one slatedb-common
slatedb-common = { git = "https://github.com/jazware/slatedb", rev = "9bbeb849e6ead04556c831c50078568ca118903c" }

# Fat LTO + 1 codegen unit: ~4 min of a release build is this crate's
# single-threaded optimization and LTO, but cheaper settings cost runtime
# (A/B on a 16-core Zen 5 box, bench/results/buildspeed-ab-2026-10-03:
# 3 rounds, CPU/commit noise about +-1%): thin LTO
# with 16 units +2.5-3.4% CPU per commit and -3-4% read ops/s (x86-64-v3
# wins back ~1 point); fat LTO with 16 units CPU/commit within noise but reads
# -1.3%; no LTO +10-11% CPU/commit and -15% reads.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# keep symbols for profiling (sample/perf/pprof)
debug = 1

# fast iteration builds: `cargo build --profile dev-release`. No LTO and
# incremental, so an edit recompiles only the crate; dependencies are built
# once at full opt-level and cached. Benches/deploys use --release.
[profile.dev-release]
inherits = "release"
opt-level = 2
lto = false
debug = "line-tables-only"
codegen-units = 256
incremental = true

[profile.dev-release.package."*"]
opt-level = 3

# `cargo test` (tests/STATUS.md): quick to build and link, still fast enough
# to run (crypto, CBOR and MST code is slow at opt-level 0).
[profile.test]
opt-level = 1
debug = 0
lto = false
# incremental reuse is per codegen unit: with 16, a one-line edit re-optimizes
# a sixteenth of the crate (lib rebuild 3-16 s vs ~3 s; suite runtime equal)
codegen-units = 256
incremental = true

[profile.test.package."*"]
opt-level = 2
codegen-units = 16

[dev-dependencies]
# brotli-encoded stub AppView bodies (read-after-write tests)
brotli = "9"
# tests cross-check libsecp256k1 signatures against RustCrypto
k256 = { version = "0.14", features = ["ecdsa"] }
# differential tests (tests/all/differential_shrike.rs): a second atproto
# implementation (DAG-CBOR, CID, CAR, MST, proofs, crypto, syntax, lexicon)
shrike = { version = "=0.7.0", default-features = false, features = ["syntax", "cbor", "crypto", "mst", "repo", "car", "lexicon"] }
