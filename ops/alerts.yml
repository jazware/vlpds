# Prometheus alerting rules for vlpds.
#
# Every alert carries `severity` (page | ticket), a summary, and a runbook_url
# anchor into ops/RUNBOOK.md (one section per alert, heading = alert name).
#
# Assumptions (edit to match the deployment):
# - Nodes are scraped under job="vlpds" (bench/obs/prometheus/prometheus.yml
#   and deploy/ansible/roles/alloy/templates/vlpds-monitoring.alloy.j2 both
#   use that name). The bench scrape config lists ~30 ports that are usually
#   down: load these rules only against a Prometheus that scrapes the real
#   cluster's nodes, or VlpdsNodeDown fires for every idle bench port.
# - One cluster per Prometheus. With several, add a cluster label to the
#   targets and to every `sum(...)` / `count(...)` below (`by (cluster)`).
# - The lease alerts scale with each node's configured --lease-ttl-ms, which
#   it exports as vlpds_lease_ttl_seconds (with vlpds_lease_renew_interval_
#   seconds and vlpds_lease_skew_seconds, both TTL / 5) and through the
#   vlpds_lease_renew_ttl_ratio histogram (renewal round trip / TTL). At the
#   default 10 s TTL: renew every 2 s, validity TTL - skew = 8 s, renewal
#   ceiling 4 s; at 60 s (the tiny profile): every 12 s, 48 s, 24 s.
#   Nodes built before these metrics existed export neither, and the
#   TTL-relative lease alerts stay silent for them.
#
# Thresholds: the design numbers are ~40-50 ms p50 / ~150 ms p99 commit ack
# on S3 Standard, ~25 ms segment PUTs, hedging after 100 ms, a 3 s forward
# deadline, and a lease renewal ceiling of 0.4 x TTL (4 s at the default
# 10 s TTL). Thresholds derived from those are marked "design"; the rest are
# marked "guess" and should be tuned against a week of production data.

groups:
  - name: vlpds-derived
    rules:
      # Shards in the layout, as the nodes report it (vlpds_shard_layout_shards
      # follows every split/merge). The live nodes' max; with none up, each
      # node's last value from the past hour, so VlpdsShardsUnowned still
      # fires when the whole cluster is down.
      - record: vlpds:layout_shards
        expr: >-
          max(vlpds_shard_layout_shards{job="vlpds"})
            or max(last_over_time(vlpds_shard_layout_shards{job="vlpds"}[1h]))

  # ---------------------------------------------------------------------------
  # Node liveness and fail-stops
  # ---------------------------------------------------------------------------
  - name: vlpds-liveness
    rules:
      - alert: VlpdsNodeDown
        expr: up{job="vlpds"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "vlpds node {{ $labels.instance }} has not answered a scrape for 2 minutes"
          description: >-
            Peers take its shards over after TTL + skew (1.2 x TTL: 12 s at
            the default 10 s TTL, 72 s at 60 s) or within 3-5 s if its port
            refuses connections, so writes
            should already be served elsewhere; capacity is reduced and a
            second loss may overload the rest.
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsnodedown"

      # No vlpds target is scraped at all (scrape config missing, the
      # collector down, or every target dropped): every other alert here
      # is blind. With several clusters on one evaluator, scope it per
      # cluster (roles/monitoring's extra_labels adds the cluster filter to
      # the selector and the label to the alert), or one scraped cluster
      # hides another's absence.
      - alert: VlpdsNotScraped
        expr: absent(up{job="vlpds"})
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "No vlpds scrape target has reported for 10 minutes: vlpds alerting is blind"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsnotscraped"

      # A new process: its start time changed. Expected during a deploy.
      - alert: VlpdsNodeRestarted
        expr: changes(vlpds_process_start_time_seconds{job="vlpds"}[15m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "vlpds node {{ $labels.instance }} restarted (fail-stop, crash, OOM or deploy)"
          description: >-
            The process start time changed in the last 15 minutes.
            vlpds_last_exit_reason_info says how the previous process ended.
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsnoderestarted"

      # The process exits on purpose (fail-stop) when its lease lapses, its
      # log is fenced, or a segment upload / state apply fails (exit codes
      # 2-5), and on signature faults (6), an incompatible feature level (7),
      # a failed shutdown fence (8) or a panic in a critical thread or task
      # (9, critical_task_panicked). It records why in its exit-state file (--exit-state-file, by
      # default in --cache-dir) and the next process exports it while it runs.
      # crash = the previous process recorded no exit (SIGKILL, OOM, abort).
      # Only reported for 30 minutes after the restart.
      - alert: VlpdsNodeFailStopped
        expr: >-
          vlpds_last_exit_reason_info{job="vlpds",reason!~"clean|none"} == 1
          and on (instance) (time() - vlpds_process_start_time_seconds{job="vlpds"}) < 1800
        labels:
          severity: ticket
        annotations:
          summary: "vlpds node {{ $labels.instance }}'s previous process ended with {{ $labels.reason }} (exit code {{ $labels.code }})"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsnodefailstopped"

      - alert: VlpdsNodeCrashLooping
        expr: changes(vlpds_process_start_time_seconds{job="vlpds"}[1h]) >= 3
        labels:
          severity: page
        annotations:
          summary: "vlpds node {{ $labels.instance }} restarted {{ $value }} times in an hour"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsnodecrashlooping"

      # A node fenced the log of an incarnation that ended without fencing it
      # itself (crash, kill -9, OOM, fail-stop, partition): reason="peer" for
      # a dead peer's (counted on the survivor, so it survives a node that
      # never comes back), "restart" for its own previous one at startup. A
      # graceful stop fences its own log and is never counted.
      - alert: VlpdsUncleanNodeExit
        expr: sum by (reason) (increase(vlpds_peer_takeovers_total{job="vlpds"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} node incarnation(s) ended uncleanly and were fenced ({{ $labels.reason }}) in the last 15 minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsuncleannodeexit"

      # A node saw a peer miss a renewal and its port refuse connections:
      # the peer's process is gone (kill -9, crash, OOM) and its shards are
      # being taken over now.
      - alert: VlpdsPeerPresumedDead
        expr: sum by (instance) (increase(vlpds_lease_events_total{job="vlpds",event="peer_refused"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} presumed a peer dead (missed renewal + connection refused)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdspeerpresumeddead"

      - alert: VlpdsMixedVersions
        expr: count(count by (rev) (vlpds_build_info{job="vlpds"})) > 1
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "vlpds nodes have run {{ $value }} different git revisions for over an hour (stuck rolling deploy?)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmixedversions"

      # A decode met an unknown or malformed format marker (segment magic or
      # codec, log stream message type, applied marker, cluster/version):
      # a node wrote a format before its level was active, or corruption.
      # Never expected (design): page on the first one.
      - alert: VlpdsFormatErrors
        expr: sum by (instance, format) (increase(vlpds_format_errors_total{job="vlpds"}[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: {{ $value }} {{ $labels.format }} format errors in 10 minutes (unknown version marker or corruption)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsformaterrors"

      # The previous process refused to start (exit 7 incompatible_level):
      # its build can't run the cluster's feature level. Only visible once a
      # process on that exit-state file serves again; a node looping on exit 7
      # never serves /metrics, so VlpdsNodeDown fires for it as well.
      - alert: VlpdsIncompatibleNode
        expr: vlpds_last_exit_reason_info{job="vlpds",reason="incompatible_level"} == 1
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s previous process exited 7: its build could not run the cluster's feature level (old image after a finalize?)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsincompatiblenode"

      # Every node runs a build that supports a higher feature level than the
      # active one, for two weeks: the upgrade was never finalized. Open
      # windows block the next build from dropping old formats (design).
      - alert: VlpdsFeatureLevelUnfinalized
        expr: min(vlpds_feature_level{job="vlpds",kind="binary_max"}) > max(vlpds_feature_level{job="vlpds",kind="active"})
        for: 14d
        labels:
          severity: ticket
        annotations:
          summary: "every vlpds node can run feature level {{ $value }}+ but the cluster has not been finalized for 14 days"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfeaturelevelunfinalized"

  # ---------------------------------------------------------------------------
  # Shard ownership
  # ---------------------------------------------------------------------------
  - name: vlpds-ownership
    rules:
      # A dead node's series go stale on its failed scrape, so its shards
      # count as unowned until a peer opens them: normally 3-5 s (refused
      # probe) or TTL + skew (12 s at the default TTL, 72 s at 60 s) plus
      # replay. 2 minutes is past that at TTLs up to ~60 s (design). `or vector(0)` keeps it firing when every node is down.
      - alert: VlpdsShardsUnowned
        expr: (sum(vlpds_owned_partitions{job="vlpds"}) or vector(0)) < vlpds:layout_shards
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Only {{ $value }} shards are owned by a live node (layout has {{ with query \"vlpds:layout_shards\" }}{{ . | first | value }}{{ end }})"
          description: >-
            Writes and getRecord-style reads for repos in the missing shards
            fail (503 PartitionUnavailable / ShardMoved resends time out).
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsshardsunowned"

      # Safety does not depend on this (fencing + CAS assignments), but two
      # nodes both reporting a shard for 5 minutes means a zombie that has not
      # fail-stopped (or nodes disagree on the layout mid split/merge).
      - alert: VlpdsShardsOverOwned
        expr: sum(vlpds_owned_partitions{job="vlpds"}) > vlpds:layout_shards
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Nodes report {{ $value }} owned shards, more than the expected shard count"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsshardsoverowned"

      # A full rolling deploy moves every shard about twice (out to peers and
      # back). Four opens per shard per hour is more than any deploy (guess).
      - alert: VlpdsOwnershipFlapping
        expr: sum(increase(vlpds_lease_events_total{job="vlpds",event="opened"}[1h])) > 4 * vlpds:layout_shards
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} shard opens in the last hour: shards are moving repeatedly"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsownershipflapping"

      # Nodes take shards up to ceil(shards / live nodes) and hand extras back
      # to joiners, so a node far above the fair share for 30 minutes means
      # handback is not happening (guess: 1.5x).
      - alert: VlpdsOwnershipImbalanced
        expr: >-
          max(vlpds_owned_partitions{job="vlpds"})
            > 1.5 * scalar(vlpds:layout_shards) / count(up{job="vlpds"} == 1)
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "A vlpds node owns {{ $value }} shards, over 1.5x the fair share"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsownershipimbalanced"

      # Shards whose SlateDB open or replay failed (released for another
      # node or a later step to retry).
      - alert: VlpdsShardOpenErrors
        expr: sum by (instance) (increase(vlpds_shards_opened_total{job="vlpds",result="error"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} failed to open {{ $value | printf \"%.0f\" }} shard(s) in the last 15 minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsshardopenerrors"

      # A batch of shard opens that replayed a dead owner's log tail took over
      # 20 s (the 20.48 s bucket) before serving. Checkpoints every 10 s keep
      # replay to seconds normally (guess).
      - alert: VlpdsTakeoverReplaySlow
        expr: >-
          sum by (instance) (increase(vlpds_shard_open_seconds_count{job="vlpds",kind="replay"}[1h]))
            - sum by (instance) (increase(vlpds_shard_open_seconds_bucket{job="vlpds",kind="replay",le="20.48"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "A takeover on {{ $labels.instance }} took over 20 s (open + replay) before serving its shards"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdstakeoverreplayslow"

  # ---------------------------------------------------------------------------
  # Node leases (renew every TTL / 5, validity TTL - skew = 0.8 x TTL after a
  # renewal's send time, fail-stop once a renewal round trip exceeds the
  # 0.4 x TTL ceiling; 2 s / 8 s / 4 s at the default 10 s TTL). Thresholds
  # are fractions of each node's own vlpds_lease_ttl_seconds.
  # ---------------------------------------------------------------------------
  - name: vlpds-leases
    rules:
      # Any renewal over 0.2 x TTL (vlpds_lease_renew_ttl_ratio): half the
      # 0.4 x TTL ceiling past which the node's validity lapses and it
      # fail-stops (design). Not a fail-stop yet; VlpdsLeaseRenewalAtCeiling
      # is.
      - alert: VlpdsLeaseRenewalNearCeiling
        expr: >-
          sum by (instance) (increase(vlpds_lease_renew_ttl_ratio_count{job="vlpds"}[5m]))
            - sum by (instance) (increase(vlpds_lease_renew_ttl_ratio_bucket{job="vlpds",le="0.2"}[5m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | printf \"%.0f\" }} lease renewal(s) took over 0.2 x TTL in 5 minutes (fail-stop at 0.4 x TTL)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsleaserenewalnearceiling"

      # A renewal over 0.4 x TTL: the node's validity gapped and it
      # fail-stopped (or is about to). On several nodes at once this is a
      # store brownout stopping the cluster (design).
      - alert: VlpdsLeaseRenewalAtCeiling
        expr: >-
          sum by (instance) (increase(vlpds_lease_renew_ttl_ratio_count{job="vlpds"}[5m]))
            - sum by (instance) (increase(vlpds_lease_renew_ttl_ratio_bucket{job="vlpds",le="0.4"}[5m])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | printf \"%.0f\" }} lease renewal(s) took over 0.4 x TTL in 5 minutes: past the fail-stop ceiling"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsleaserenewalatceiling"

      # Relative to the TTL, not absolute: a renewal is one small CAS PUT,
      # ~25-50 ms on S3 but routinely 250-600 ms on R2, which is harmless
      # against a 60 s TTL. p99 past a quarter of the fail-stop ceiling for
      # 10 minutes is store or network trouble building up.
      - alert: VlpdsLeaseRenewalSlow
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_lease_renew_ttl_ratio_bucket{job="vlpds"}[5m]))) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Lease renewal p99 on {{ $labels.instance }} is {{ $value | humanizePercentage }} of the TTL (fail-stop ceiling 40%)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsleaserenewalslow"

      # Renewals that failed with an error or a client timeout (retried at
      # the next renew tick, TTL / 5; conflict and lapsed fail-stop and show
      # up as restarts instead).
      - alert: VlpdsLeaseRenewErrors
        expr: sum by (instance, kind) (increase(vlpds_lease_renew_errors_total{job="vlpds",kind=~"timeout|error"}[5m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | printf \"%.0f\" }} lease renewal(s) failed ({{ $labels.kind }}) in 5 minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsleaserenewerrors"

      # Validity left normally stays between 0.6 and 0.8 x TTL (renewed
      # every 0.2 x TTL). Under 0.4 x TTL at a scrape means renewals are
      # 0.2 x TTL or more overdue: the node is within 0.4 x TTL of a
      # fail-stop (design).
      - alert: VlpdsLeaseValidityLow
        expr: >-
          min_over_time(vlpds_lease_validity_seconds{job="vlpds"}[5m])
            < ignoring (node_id) group_left 0.4 * vlpds_lease_ttl_seconds{job="vlpds"}
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} ({{ $labels.node_id }}) had only {{ $value | humanizeDuration }} of lease validity left (under 0.4 x TTL)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsleasevaliditylow"

  # ---------------------------------------------------------------------------
  # Write path (commit log)
  # ---------------------------------------------------------------------------
  - name: vlpds-writes
    rules:
      # Design: ~150 ms p99 on S3 Standard. 500 ms is >3x that (guess).
      - alert: VlpdsCommitLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_commit_durable_seconds_bucket{job="vlpds"}[5m]))) > 0.5
          and on (instance) sum by (instance) (rate(vlpds_commit_durable_seconds_count{job="vlpds"}[5m])) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Commit ack p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }} (design ~150 ms)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscommitlatencyhigh"

      # 2 s: close to the 3 s forward deadline, past which forwarded writes
      # fail (design-derived).
      - alert: VlpdsCommitLatencyCritical
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_commit_durable_seconds_bucket{job="vlpds"}[5m]))) > 2
          and on (instance) sum by (instance) (rate(vlpds_commit_durable_seconds_count{job="vlpds"}[5m])) > 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Commit ack p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}: forwarded writes start failing at 3 s"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscommitlatencycritical"

      # Entries are waiting for the sequencer but no segment became durable
      # for 2 minutes: the log is wedged (segment PUTs retry forever).
      - alert: VlpdsCommitLogStalled
        expr: >-
          max by (instance) (vlpds_sequencer_queue_depth{job="vlpds"}) > 0
          and on (instance) sum by (instance) (rate(vlpds_segments_total{job="vlpds"}[2m])) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} has {{ $value }} log entries queued and no durable segment in 2 minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscommitlogstalled"

      # now - own watermark, in microseconds. Idle logs advertise the clock
      # (lag ~0); under load it is about one segment PUT. Only meaningful
      # while the node owns shards (the gauge is not updated otherwise).
      # 2 s (guess: half the lease ceiling at the default 10 s TTL).
      - alert: VlpdsWatermarkLagHigh
        expr: >-
          max by (instance) (vlpds_watermark_lag_microseconds{job="vlpds"}) > 2e6
          and on (instance) vlpds_owned_partitions{job="vlpds"} > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s log watermark is {{ $value | humanize }}us behind its clock"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdswatermarklaghigh"

      # Design: ~25 ms PUTs; a hedge starts at 100 ms. 250 ms p99 means hedges
      # are not saving the tail (guess).
      - alert: VlpdsSegmentPutLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_segment_put_seconds_bucket{job="vlpds"}[5m]))) > 0.25
          and on (instance) sum by (instance) (rate(vlpds_segment_put_seconds_count{job="vlpds"}[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Segment PUT p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }} (design ~25 ms, hedge at 100 ms)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssegmentputlatencyhigh"

      # result="already_exists" is a lost hedge race (verified by content),
      # not an error.
      - alert: VlpdsSegmentPutErrors
        expr: sum by (instance) (rate(vlpds_segment_put_attempts_total{job="vlpds",result="error"}[5m])) > 0.1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} failed segment PUT attempts/s (retried until durable)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssegmentputerrors"

      - alert: VlpdsWritesShed
        expr: sum by (instance) (rate(vlpds_writes_shed_total{job="vlpds"}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} is rejecting {{ $value | humanize }} writes/s with 503 Overloaded (--max-inflight-writes)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdswritesshed"

      # Logins/sign-ups/password changes answered 503 Overloaded because every
      # Argon2 permit (one per core, at most 16) stayed busy for 2 s: a login
      # flood, or too little CPU for the sign-in rate. 0.5/s for 10m (guess).
      - alert: VlpdsPasswordHashingShed
        expr: sum by (instance) (rate(vlpds_argon2_shed_total{job="vlpds"}[5m])) > 0.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} is shedding {{ $value | humanize }} password checks/s with 503 Overloaded (Argon2 saturated)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdspasswordhashingshed"

      # Proxied requests refused 429 at 64 in flight for one account on its
      # owner. One client misbehaving trips it briefly; sustained for 30m
      # it's a stuck or abusive client, or a slow upstream (guess).
      - alert: VlpdsProxyAccountCapSustained
        expr: sum by (instance) (rate(vlpds_proxy_rejected_total{job="vlpds",reason="account_cap"}[5m])) > 1
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} is refusing {{ $value | humanize }} proxied requests/s at the per-account in-flight cap"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsproxyaccountcapsustained"

      # Account mail refused because the node's mail-node-hour budget (200/h
      # by default) is spent: users aren't getting confirmation, reset or
      # sign-in codes. Any refusal is worth a look.
      - alert: VlpdsMailNodeBudgetExhausted
        expr: sum by (instance) (increase(vlpds_mail_suppressed_total{job="vlpds",reason="node_limit"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} refused {{ $value | humanize }} account mails in 15m: its mail-node-hour budget is spent"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmailnodebudgetexhausted"

      # The cluster's daily mail budget (mail-cluster-day, --mail-daily-budget)
      # is spent: no node mails accounts until the UTC day ends. Every node
      # reads the one count from the bucket, so the lowest reading is the
      # newest.
      - alert: VlpdsMailClusterBudgetExhausted
        expr: sum(increase(vlpds_mail_suppressed_total{job="vlpds",reason="cluster_limit"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "the cluster refused {{ $value | humanize }} account mails in 15m: its daily mail budget (mail-cluster-day) is spent"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmailclusterbudgetexhausted"

      # Under 20% of the day's mail budget left: a signup wave or abuse is
      # draining it, and mail stops when it runs out (guess: 20%).
      - alert: VlpdsMailClusterBudgetLow
        expr: >-
          min(vlpds_mail_budget_remaining{job="vlpds",window="day"})
            < 0.2 * max(vlpds_mail_budget_limit{job="vlpds",window="day"})
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanize }} account mails left in the cluster's daily mail budget (under 20%)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmailclusterbudgetlow"

      # The budget's bucket object couldn't be read or written, so mail went
      # out uncounted: the provider's quota is unguarded beyond each node's
      # mail-node-hour.
      - alert: VlpdsMailBudgetUncounted
        expr: sum by (instance) (increase(vlpds_mail_budget_errors_total{job="vlpds"}[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} sent {{ $value | humanize }} account mails in 15m without counting them in the cluster mail budget (store errors)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmailbudgetuncounted"

      - alert: VlpdsWriteInternalErrors
        expr: sum by (instance, kind) (rate(vlpds_write_errors_total{job="vlpds",kind=~"internal|unavailable"}[5m])) > 0.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} writes/s failing with kind={{ $labels.kind }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdswriteinternalerrors"

      # 5xx share of locally served XRPC (proxied appview calls excluded:
      # their 5xx are the upstream's). 5% (guess).
      - alert: VlpdsHttp5xxHigh
        expr: >-
          sum by (instance) (rate(vlpds_http_requests_total{job="vlpds",status=~"5..",method!="_proxy_or_unmatched"}[5m]))
            / sum by (instance) (rate(vlpds_http_requests_total{job="vlpds",method!="_proxy_or_unmatched"}[5m])) > 0.05
          and on (instance) sum by (instance) (rate(vlpds_http_requests_total{job="vlpds",method!="_proxy_or_unmatched"}[5m])) > 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} of XRPC requests on {{ $labels.instance }} return 5xx"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdshttp5xxhigh"

  # ---------------------------------------------------------------------------
  # Forwarding between nodes
  # ---------------------------------------------------------------------------
  - name: vlpds-forwarding
    rules:
      # result="5xx" includes "owner unreachable" and "past its 3 s TTFB
      # deadline". 5% (guess).
      - alert: VlpdsForwardErrorsHigh
        expr: >-
          sum by (instance) (rate(vlpds_forwards_total{job="vlpds",result="5xx"}[5m]))
            / sum by (instance) (rate(vlpds_forwards_total{job="vlpds"}[5m])) > 0.05
          and on (instance) sum by (instance) (rate(vlpds_forwards_total{job="vlpds"}[5m])) > 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests {{ $labels.instance }} forwards to shard owners fail with 5xx"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsforwarderrorshigh"

      # Forwarded time to the owner's response head. 1 s p99 is a third of
      # the 3 s deadline (guess).
      - alert: VlpdsForwardLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_forward_seconds_bucket{job="vlpds"}[5m]))) > 1
          and on (instance) sum by (instance) (rate(vlpds_forward_seconds_count{job="vlpds"}[5m])) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Forward p99 from {{ $labels.instance }} is {{ $value | humanizeDuration }} (deadline 3 s)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsforwardlatencyhigh"

      # Resends of writes answered 503 RepoLoading / ShardMoved / unreachable.
      # Bursts are normal for a few seconds around a restart or handoff; a
      # sustained rate is not (guess: 50/s for 10 minutes).
      - alert: VlpdsWriteResendsSustained
        expr: sum by (instance, reason) (rate(vlpds_write_retries_total{job="vlpds"}[5m])) > 50
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} resends {{ $value | humanize }} writes/s (reason={{ $labels.reason }})"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdswriteresendssustained"

  # ---------------------------------------------------------------------------
  # Firehose
  # ---------------------------------------------------------------------------
  - name: vlpds-firehose
    rules:
      # Seq assignment of a batch's oldest event -> emit. Includes the PUT,
      # the peer stream and waiting for the minimum watermark of every log
      # (so also the largest clock offset between nodes). 2 s (guess).
      - alert: VlpdsFirehoseEmitDelayHigh
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_firehose_emit_delay_seconds_bucket{job="vlpds"}[5m]))) > 2
          and on (instance) sum by (instance) (rate(vlpds_firehose_emit_delay_seconds_count{job="vlpds"}[5m])) > 0.1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Firehose emit delay p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfirehoseemitdelayhigh"

      - alert: VlpdsFirehoseEmitDelayCritical
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_firehose_emit_delay_seconds_bucket{job="vlpds"}[5m]))) > 20
          and on (instance) sum by (instance) (rate(vlpds_firehose_emit_delay_seconds_count{job="vlpds"}[5m])) > 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Firehose emit delay p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}: relays see stale data"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfirehoseemitdelaycritical"

      # The cluster commits but this node's merger emitted nothing for 5
      # minutes: the merge is held at some log's watermark.
      - alert: VlpdsFirehoseStalled
        expr: >-
          sum by (instance) (rate(vlpds_firehose_events_total{job="vlpds"}[5m])) == 0
          and on () sum(rate(vlpds_commits_total{job="vlpds"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}'s firehose emitted nothing in 5 minutes while the cluster is committing"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfirehosestalled"

      # Subscribers more than --firehose-max-lag-mb behind (default 128 MiB;
      # each node exports its value as vlpds_firehose_max_lag_bytes) are cut
      # off with ConsumerTooSlow. A few are normal; a cluster-wide rate means
      # the server is the slow side (guess: 0.1/s).
      - alert: VlpdsFirehoseConsumersTooSlow
        expr: sum by (instance) (rate(vlpds_firehose_disconnects_total{job="vlpds",reason="too_slow"}[10m])) > 0.1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} cuts off {{ $value | humanize }} firehose subscribers/s with ConsumerTooSlow"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfirehoseconsumerstooslow"

      # A log over the merger's byte budget (--firehose-merge-queue-mb,
      # default 256 MiB) is read back from S3 instead: some log's watermark
      # is far behind the others.
      - alert: VlpdsFirehoseMergeSpilling
        expr: sum by (instance) (increase(vlpds_firehose_merge_spills_total{job="vlpds"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s firehose merger spilled a log to S3 read-back"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfirehosemergespilling"

      # Peer followers dropped for falling behind the 128 MiB live ring; they
      # catch up from S3 (slower, more GETs).
      - alert: VlpdsPeerLogStreamLagging
        expr: sum by (instance) (increase(vlpds_log_stream_lagged_total{job="vlpds"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} dropped a peer log stream that fell behind its live ring"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdspeerlogstreamlagging"

  # ---------------------------------------------------------------------------
  # Object store and control plane
  # ---------------------------------------------------------------------------
  - name: vlpds-object-store
    rules:
      # Control-plane calls (leases' peers LIST, assignments, fences) given
      # up at min(TTL, 5 s). Lease renewals are not bounded and not counted
      # here (see the vlpds-leases group), but a store slow enough to time
      # these out is near the 0.4 x TTL renewal ceiling (4 s at the default
      # TTL), where nodes fail-stop.
      - alert: VlpdsControlPlaneTimeouts
        expr: sum by (instance, op) (increase(vlpds_cluster_store_timeouts_total{job="vlpds"}[5m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: control-plane {{ $labels.op }} calls timed out (5 s deadline) in the last 5 minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscontrolplanetimeouts"

      # Two or more nodes at once timing out control-plane calls, or failing
      # object-store requests at the VlpdsObjectStoreErrors /
      # VlpdsObjectStoreRequestErrors rate (vlpds_object_store_requests_total
      # result=error|timeout, any component, over 1/s): a store brownout,
      # which stops every node once renewals take over 0.4 x TTL (DESIGN
      # "Renewal RTT ceiling").
      - alert: VlpdsObjectStoreBrownout
        expr: >-
          count(
            (sum by (instance) (increase(vlpds_cluster_store_timeouts_total{job="vlpds"}[5m])) > 0)
            or
            (sum by (instance) (rate(vlpds_object_store_requests_total{job="vlpds",result=~"error|timeout"}[5m])) > 1)
          ) >= 2
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} vlpds nodes are timing out control-plane calls or failing object-store requests: cluster-wide fail-stop risk"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsobjectstorebrownout"

      # vlpds' own object-store clients (objstats.rs: every request, by key
      # component): failed or timed-out requests outside shard state (that is
      # VlpdsObjectStoreErrors): control plane (ctl_*), log segments (PUTs,
      # fences, replay, backfill, follower catch-up), retention reports and
      # deletes, account index, blobs. not_found / precondition are normal
      # answers; cancelled is a caller giving up (see
      # VlpdsControlPlaneTimeouts). 1/s (guess).
      - alert: VlpdsObjectStoreRequestErrors
        expr: sum by (instance, component) (rate(vlpds_object_store_requests_total{job="vlpds",component!~"state_.*",result=~"error|timeout"}[5m])) > 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} failed object-store requests/s on {{ $labels.component }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsobjectstorerequesterrors"

      # Throttled answers (429, S3's 503 SlowDown), each one counted at the
      # HTTP layer (throttle.rs) because object_store retries them out of
      # sight of vlpds_object_store_requests_total. On lease keys each one
      # puts a CAS (a renewal too) 1-4 s back, against the 0.4 x TTL renewal
      # ceiling. A few at a restart are normal (two in a whole R2 cluster
      # run). 0.05/s for 10 min (guess).
      - alert: VlpdsObjectStoreThrottled
        expr: sum by (instance, kind) (rate(vlpds_object_store_throttled_total{job="vlpds"}[5m])) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: the object store is throttling {{ $labels.kind }} requests ({{ $value | humanize }}/s)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsobjectstorethrottled"

      # Object-store requests queued for an in-flight permit of their client
      # (objlimit.rs: log / state / ctl, lane main / reserved). A takeover's
      # burst queues briefly by design; sustained queueing is a pool too
      # small for the load or a store slowing down (every permit held
      # longer). Waits on ctl's reserved lane are lease renewals queueing
      # behind each other (guess: 1/s for 10 minutes).
      - alert: VlpdsObjectStorePermitsSaturated
        expr: sum by (instance, client, lane) (rate(vlpds_object_store_permit_waits_total{job="vlpds"}[5m])) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} object-store requests/s queue for a {{ $labels.client }} permit ({{ $labels.lane }} lane)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsobjectstorepermitssaturated"

      # Control-plane requests (leases, assignments, writer claims) are small
      # GET/PUT/LISTs: ~10-50 ms. p99 over 1 s is a quarter of the renewal
      # ceiling at the default TTL and slows every takeover step (guess).
      - alert: VlpdsControlPlaneLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(vlpds_object_store_request_seconds_bucket{job="vlpds",component=~"ctl_.*"}[5m]))) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Control-plane object-store p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscontrolplanelatencyhigh"

      # Shard state (SlateDB: WAL, memtable flushes, manifests, SSTs,
      # compaction, GC; the state_* components of vlpds' own counter,
      # objstats.rs): failed or timed-out requests. Not
      # slatedb_object_store_error_count_total: that counts every
      # non-success answer, including the not-found GETs of normal traffic
      # (each node's compactors poll ~12/s) and lost CAS races, with no label
      # to tell them apart. SlateDB retries failures (guess: 1/s).
      - alert: VlpdsObjectStoreErrors
        expr: sum by (instance, component) (rate(vlpds_object_store_requests_total{job="vlpds",component=~"state_.*",result=~"error|timeout"}[5m])) > 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} failed shard-state (SlateDB) object-store requests/s on {{ $labels.component }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsobjectstoreerrors"

      # SlateDB request latency (buckets 1 ms .. 10 s). 1 s p99 (guess).
      - alert: VlpdsObjectStoreLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (instance, le) (rate(slatedb_object_store_request_duration_seconds_bucket{job="vlpds"}[5m]))) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "SlateDB object-store p99 on {{ $labels.instance }} is {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsobjectstorelatencyhigh"

      # L0 stalls block SlateDB writes, i.e. segment apply, i.e. acks.
      - alert: VlpdsSlateDbL0Stalls
        expr: sum by (instance) (increase(slatedb_db_l0_stall_count_total{job="vlpds"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: SlateDB writes stalled on too many L0 SSTs (compaction behind)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsslatedbl0stalls"

      # Every point read checks one bloom filter per sorted run, so under
      # uniform keys the metadata cache's working set is every owned SST's
      # filter + index: vlpds_sst_meta_need_bytes, decoded (the encoded
      # vlpds_sst_meta_bytes x the measured ratio). Past the cache, each read
      # that misses fetches a whole filter or index: reads turn into GB/s of
      # store GETs. The memory sizer keeps the cache at 1.25x the need (x
      # N/(N-1) for failover) when the pool fits it, so this fires only when
      # the node's memory can't (vlpds_meta_cache_shortfall_bytes > 0) or an
      # explicit --meta-cache-mb is too small; 90% leaves room for
      # compactions in flight.
      - alert: VlpdsSstMetaCacheTooSmall
        expr: >-
          sum by (instance) (vlpds_sst_meta_need_bytes{job="vlpds"})
            > 0.9 * sum by (instance) (vlpds_meta_cache_capacity_bytes{job="vlpds"})
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s SST filters + indexes (~{{ $value | humanize1024 }}B decoded) are over 90% of its metadata cache"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssstmetacachetoosmall"

      # Metadata fetched from the store: flushes and compactions seed their
      # SSTs' filters and indexes, so steady state is ~0; a shard open or
      # takeover fetches its shards' once. Sustained fetches are the cache
      # thrashing, each one a multi-MB GET (guess: 20/s for 10 minutes).
      - alert: VlpdsSstMetaRefetching
        expr: sum by (instance) (rate(vlpds_meta_cache_loads_total{job="vlpds",result="fetched"}[5m])) > 20
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} fetches {{ $value | humanize }} SST filters/indexes per second from the store"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssstmetarefetching"

  # ---------------------------------------------------------------------------
  # Checkpoints, replay bound, retention
  # ---------------------------------------------------------------------------
  - name: vlpds-durability
    rules:
      # Every owned shard is checkpointed once per --checkpoint-every (10 s)
      # while the log moves; none for 10 minutes on a node writing segments
      # means a successor's replay keeps growing.
      - alert: VlpdsCheckpointsStalled
        expr: >-
          sum by (instance) (rate(vlpds_checkpoint_shard_seconds_count{job="vlpds"}[5m])) == 0
          and on (instance) sum by (instance) (rate(vlpds_segments_total{job="vlpds"}[5m])) > 0
          and on (instance) vlpds_owned_partitions{job="vlpds"} > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} writes segments but has checkpointed no shard in 10+ minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscheckpointsstalled"

      # Segments kept only because a crash replay could need them, expressed
      # as seconds of this node's log. Checkpoints every 10 s plus the 2 min
      # memory of closed shards put the normal value at a few minutes; 15
      # minutes (guess) means a successor would replay that much.
      - alert: VlpdsReplayBacklogHigh
        expr: >-
          max by (instance) (vlpds_retention_replay_hold_segments{job="vlpds"})
            / on (instance) sum by (instance) (rate(vlpds_segments_total{job="vlpds"}[10m])) > 900
          and on (instance) sum by (instance) (rate(vlpds_segments_total{job="vlpds"}[10m])) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "A takeover of {{ $labels.instance }}'s shards would replay ~{{ $value | humanizeDuration }} of its log"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsreplaybackloghigh"

      # A pass runs every --log-retention-interval (default 60 s) on every
      # node.
      - alert: VlpdsRetentionFailing
        expr: >-
          sum by (instance) (increase(vlpds_retention_ticks_total{job="vlpds",result="error"}[1h]))
            > 0.5 * sum by (instance) (increase(vlpds_retention_ticks_total{job="vlpds"}[1h]))
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Most log retention passes on {{ $labels.instance }} failed in the last hour (log storage grows)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsretentionfailing"

      - alert: VlpdsRetentionNotRunning
        expr: >-
          sum by (instance) (rate(vlpds_retention_ticks_total{job="vlpds"}[15m])) == 0
          and on (instance) up{job="vlpds"} == 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} has run no log retention pass in 15+ minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsretentionnotrunning"

      # A dead log that no successor has fenced holds back every node's
      # merged firehose (followers drain a log only up to its fence) and its
      # segments are never pruned. Takeover fences within seconds; a joiner
      # whose lease peers haven't seen yet also counts for a moment. Reported
      # by the dead-log pruner only (owner of slot 0's shard). 30 m (guess).
      - alert: VlpdsDeadLogUnfenced
        expr: sum(vlpds_retention_dead_logs{job="vlpds",state="unfenced"}) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} dead node log(s) have gone unfenced for 30+ minutes"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsdeadlogunfenced"

      # Retired split/merge state (src/reshard_gc.rs). The dir half runs on
      # the owner of slot 0's shard only, every 60 s.
      - alert: VlpdsReshardGcFailing
        expr: >-
          sum(increase(vlpds_reshard_gc_passes_total{job="vlpds",result="error"}[1h]))
            > 0.5 * sum(increase(vlpds_reshard_gc_passes_total{job="vlpds"}[1h]))
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Most retired-state GC passes failed in the last hour (retired shard state grows)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsreshardgcfailing"

      # A retired dir that some manifest lists although it holds no
      # checkpoint: SlateDB's clone invariant is broken. The GC keeps it.
      - alert: VlpdsRetiredStateReferenced
        expr: max(vlpds_reshard_gc_retired_dirs{job="vlpds",state="referenced"}) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} retired shard state dir(s) are listed by a manifest but hold no checkpoint (kept; investigate)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsretiredstatereferenced"

      # Retired dirs normally go within the grace (1 h) plus a forced detach
      # and the compactor's checkpoint lifetime of the op that retired them.
      # More retired dirs than live shards for 6 h (guess) means they pile up.
      - alert: VlpdsRetiredStateGrowing
        expr: >-
          max(vlpds_reshard_gc_retired_dirs{job="vlpds",state="total"})
            > max(vlpds_shard_layout_shards{job="vlpds"})
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} retired shard state dirs (more than live shards) for 6+ hours"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsretiredstategrowing"

      # Forced detach compactions that keep failing validation (conflicts
      # with the shard's own compactions are normal now and then) while
      # none completes: the shard keeps pinning its parent.
      - alert: VlpdsForcedDetachFailing
        expr: >-
          sum by (instance) (increase(vlpds_forced_compactions_total{job="vlpds",kind="detach",result="failed"}[2h])) > 5
          and on (instance) sum by (instance) (increase(vlpds_forced_compactions_total{job="vlpds",kind="detach",result="completed"}[2h])) == 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: forced detach compactions keep failing (split/merge parents stay pinned)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsforceddetachfailing"

  # ---------------------------------------------------------------------------
  # Memory, caches, runtime
  # ---------------------------------------------------------------------------
  - name: vlpds-resources
    rules:
      - alert: VlpdsMemoryHigh
        expr: vlpds_process_resident_bytes{job="vlpds"} > 0.85 * vlpds_memory_limit_bytes{job="vlpds"}
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} RSS is {{ $value | humanize1024 }}B, over 85% of the memory limit"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmemoryhigh"

      - alert: VlpdsMemoryCritical
        expr: vlpds_process_resident_bytes{job="vlpds"} > 0.95 * vlpds_memory_limit_bytes{job="vlpds"}
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} RSS is {{ $value | humanize1024 }}B, over 95% of the memory limit: OOM kill imminent"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsmemorycritical"

      # Share of queued requests whose repo was not cached (a cold load from
      # SlateDB). 20% sustained (guess) means the repo cache is too small
      # for the active set or shards keep moving.
      - alert: VlpdsRepoCacheMissRateHigh
        expr: >-
          sum by (instance) (rate(vlpds_repo_cache_lookups_total{job="vlpds",result="miss"}[10m]))
            / sum by (instance) (rate(vlpds_repo_cache_lookups_total{job="vlpds"}[10m])) > 0.2
          and on (instance) sum by (instance) (rate(vlpds_repo_cache_lookups_total{job="vlpds"}[10m])) > 10
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of repo lookups on {{ $labels.instance }} are cold loads"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsrepocachemissratehigh"

      - alert: VlpdsRepoLoadErrors
        expr: sum by (instance) (rate(vlpds_repo_loads_total{job="vlpds",result="error"}[5m])) > 0
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: cold repo loads are failing ({{ $value | humanize }}/s)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsrepoloaderrors"

      # The KEK's key service (Cloud KMS) fails or times out: writes to
      # accounts whose signing key isn't cached get 503 KeyUnavailable, new
      # accounts can't be created. Reads are unaffected. (guess)
      - alert: VlpdsKeyServiceUnavailable
        expr: sum by (instance) (rate(vlpds_kms_requests_total{job="vlpds",result="unavailable"}[5m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: KEK service unavailable ({{ $value | humanize }}/s failed calls); cold writes are failing"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdskeyserviceunavailable"

      # A wrapped secret didn't authenticate (wrong KEK, KEK retired too
      # early, or a corrupt row): that account can't write. Should never happen.
      - alert: VlpdsSecretUnwrapRejected
        expr: sum by (instance) (increase(vlpds_kms_requests_total{job="vlpds",op="unwrap",result="rejected"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: wrapped secrets rejected by the KEK"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssecretunwraprejected"

      # PLC directory writes (genesis ops at createAccount, handle and
      # signing-key updates, submitPlcOperation, key rotation) failing as
      # unavailable (5xx, 429, timeouts, connection errors): account
      # creation and handle changes fail with 500 and change nothing.
      # Existing accounts keep working. (guess)
      - alert: VlpdsPlcDirectoryUnavailable
        expr: sum by (instance) (rate(vlpds_plc_requests_total{job="vlpds",op=~"create|update_handle|update_signing_key|submit|tombstone|rotate_key",result="unavailable"}[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: PLC directory writes failing ({{ $value | humanize }}/s); createAccount and handle changes return 500"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsplcdirectoryunavailable"

      # The directory refused an op this server built and signed (genesis,
      # handle/key update, tombstone, key rotation): a bug, a rotation key
      # the DID doesn't list, or a directory rule change. Client-built ops
      # (submitPlcOperation) are excluded.
      - alert: VlpdsPlcOpsRejected
        expr: sum by (instance, op) (increase(vlpds_plc_requests_total{job="vlpds",op=~"create|update_handle|update_signing_key|tombstone|rotate_key",result="rejected"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: PLC directory rejected {{ $value | humanize }} {{ $labels.op }} ops in the last hour"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsplcopsrejected"

      # A signature failed verification right after signing (crypto.rs):
      # it was not emitted, but this host is flipping bits (memory/CPU).
      # Three within a minute fail-stop the node (next alert).
      - alert: VlpdsSignatureFault
        expr: sum by (instance, purpose) (increase(vlpds_signature_verify_failures_total{job="vlpds"}[1h])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.purpose }} signature failed verification after signing (suspect hardware)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssignaturefault"

      # The previous process fail-stopped on repeated signature faults. Kept
      # for as long as the new process runs: the host stays suspect.
      - alert: VlpdsSignatureFaultFailStop
        expr: vlpds_last_exit_reason_info{job="vlpds",reason="signature_fault"} == 1
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }} fail-stopped on repeated signature faults; drain and replace the host"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssignaturefault"

      # A persisted MST node or rebuilt subtree didn't match its link: the
      # repo was rebuilt from its records instead. Should never happen.
      - alert: VlpdsLazyMstInvalid
        expr: sum by (instance) (increase(vlpds_lazy_mst_fallbacks_total{job="vlpds",reason="invalid"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} found a persisted MST that didn't match its root and rebuilt it"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdslazymstinvalid"

      # Bounded in-memory caches (session/oauth tokens, proxy accounts and
      # JWTs, DID docs, lexicons, ...) at their entry cap. A full LRU is not
      # an error by itself; this is a hint to raise --cache-budget-mb when
      # it coincides with latency (guess: 98% for 6 h).
      - alert: VlpdsCacheAtCapacity
        expr: >-
          vlpds_cache_entries{job="vlpds"} / vlpds_cache_capacity_entries{job="vlpds"} > 0.98
          and vlpds_cache_capacity_entries{job="vlpds"} > 0
        for: 6h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s {{ $labels.cache }} cache has been at its entry cap for 6 hours"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdscacheatcapacity"

      # Merger queue over 80% of its byte budget (--firehose-merge-queue-mb,
      # default 256 MiB, exported as vlpds_firehose_merge_queue_budget_bytes);
      # past it, logs spill to S3 read-back.
      - alert: VlpdsFirehoseMergeQueueNearBudget
        expr: >-
          vlpds_firehose_merge_queue_bytes{job="vlpds"}
            > 0.8 * vlpds_firehose_merge_queue_budget_bytes{job="vlpds"}
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s firehose merger holds {{ $value | humanize1024 }}B waiting for the min watermark (over 80% of its budget)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsfirehosemergequeuenearbudget"

      # Fraction of wall time the 10 ms ticker could not run (runtime threads
      # blocked or starved). 5% (guess).
      - alert: VlpdsRuntimeStalls
        expr: rate(vlpds_runtime_late_seconds_total{job="vlpds"}[5m]) > 0.05
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s tokio runtime is late {{ $value | humanizePercentage }} of the time"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsruntimestalls"

      - alert: VlpdsRuntimeSaturated
        expr: rate(vlpds_tokio_busy_seconds_total{job="vlpds"}[5m]) / vlpds_tokio_workers{job="vlpds"} > 0.9
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s tokio workers are {{ $value | humanizePercentage }} busy"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsruntimesaturated"

      # Peer mTLS (--peer-tls-*): this node's certificate or the earliest
      # trusted cluster CA expires within 14 days (design: renew well ahead;
      # an expired node cert is refused by every peer, and the node itself
      # refuses to start or reload with one). Exported only with peer TLS on.
      - alert: VlpdsPeerTlsCertExpiring
        expr: (vlpds_peer_tls_cert_expiry_seconds{job="vlpds"} - time()) < 14 * 86400
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}'s peer TLS {{ $labels.cert }} certificate expires in {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdspeertlscertexpiring"

      # A changed CA/cert/key set (or a SIGHUP) failed to load: the node keeps
      # the previous set, which is what the rotation meant to replace.
      - alert: VlpdsPeerTlsReloadFailing
        expr: increase(vlpds_peer_tls_reloads_total{job="vlpds",result="error"}[15m]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }} failed to reload its peer TLS certificate (still using the previous one)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdspeertlsreloadfailing"

      # Peers refused at the TLS handshake (guess: sustained for 10 min): a
      # node with a cert from another CA, an expired cert, or a node at an
      # address whose lease names another node.
      - alert: VlpdsPeerTlsHandshakeFailures
        expr: sum by (instance, side) (rate(vlpds_peer_tls_handshake_failures_total{job="vlpds"}[5m])) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: peer TLS handshakes failing ({{ $labels.side }} side, {{ $value | humanize }}/s)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdspeertlshandshakefailures"

  # ---------------------------------------------------------------------------
  # Accounts: scheduled deletion, sign-in security
  # ---------------------------------------------------------------------------
  - name: vlpds-accounts
    rules:
      # Each node sweeps its shards' scheduled deletions every 10 min. A pass
      # errs when a shard scan or an account's deletion fails; the account is
      # retried next pass, so a lone failure heals. Half the passes of the
      # last hour, for an hour, means an account that keeps failing (guess).
      - alert: VlpdsScheduledDeletionFailing
        expr: sum by (instance) (increase(vlpds_scheduled_deletion_passes_total{job="vlpds",result="error"}[1h])) >= 3
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} of its scheduled-deletion sweeps failed in the last hour, for an hour"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsscheduleddeletionfailing"

      # Accounts with a deleteAfter grew by over 50 and 0.1% of all accounts
      # in a day (guess): a wave of deactivations asking for deletion, e.g.
      # an OAuth client that deactivates the accounts it holds. The minimum
      # hold (--delete-after-min-hold-days, 3) is the time left to act.
      - alert: VlpdsScheduledDeletionsSurge
        expr: >-
          (sum(vlpds_scheduled_deletion_accounts{job="vlpds",state="scheduled"})
            - sum(vlpds_scheduled_deletion_accounts{job="vlpds",state="scheduled"} offset 1d)) > 50
          and
          (sum(vlpds_scheduled_deletion_accounts{job="vlpds",state="scheduled"})
            - sum(vlpds_scheduled_deletion_accounts{job="vlpds",state="scheduled"} offset 1d))
            > 0.001 * sum(vlpds_accounts{job="vlpds"})
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanize }} more accounts are scheduled for deletion than a day ago (deleted after a 3-day minimum hold)"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsscheduleddeletionssurge"

      # A new-device sign-in alert not mailed because the account's own
      # mail-recipient-* budget was spent. Alerts are capped at a tenth of
      # that budget, so something else filled the inbox's quota first: an
      # inbox flood followed by a quiet sign-in is how a takeover would
      # hide. (Node and cluster budgets: VlpdsMail*BudgetExhausted.)
      - alert: VlpdsSignInAlertsSuppressed
        expr: sum(increase(vlpds_mail_suppressed_total{job="vlpds",purpose="sign_in_alert",reason="recipient_limit"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanize }} new-device sign-in alerts were not mailed in the last hour: the recipient's mail budget was spent"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdssigninalertssuppressed"

  # ---------------------------------------------------------------------------
  # Spaces (--spaces). Every vlpds_space_* series is registered on first use,
  # so these stay silent on nodes without the flag.
  # ---------------------------------------------------------------------------
  - name: vlpds-spaces
    rules:
      # A node's oldest notifyWrite outbox row has waited over an hour: some
      # authority hasn't acknowledged a write for that long. Retries back off
      # from 1 min to 1 h and give up 24 h after the rev was owed, so an hour means
      # several failed sends in a row (design: the retry schedule).
      - alert: VlpdsSpaceOutboxBacklog
        expr: max by (instance) (vlpds_space_outbox_oldest_seconds{job="vlpds"}) > 3600
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: a space write has waited {{ $value | humanizeDuration }} for its authority's notifyWrite ack"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsspaceoutboxbacklog"

      # A space repo's stored head disagreed with the set hash recomputed
      # from its records. That's an integrity bug, never load (design).
      - alert: VlpdsSpaceDigestMismatch
        expr: sum by (instance) (increase(vlpds_space_digest_mismatch_total{job="vlpds"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.instance }}: {{ $value | humanize }} space repo digest mismatches in the last hour"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsspacedigestmismatch"

      # Over half of the notifies forwarded to registered syncers fail, at
      # over 0.1/s, for 30 min (guess). Syncers are third-party services, so
      # a single dead one can do this on a small node.
      - alert: VlpdsSpaceNotifyFanoutFailing
        expr: >-
          sum by (instance) (rate(vlpds_space_notify_total{job="vlpds",hop="fanout",result!="ok"}[15m]))
            / sum by (instance) (rate(vlpds_space_notify_total{job="vlpds",hop="fanout"}[15m])) > 0.5
          and on (instance) sum by (instance) (rate(vlpds_space_notify_total{job="vlpds",hop="fanout",result!="ok"}[15m])) > 0.1
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of space notifies forwarded to syncers from {{ $labels.instance }} fail"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsspacenotifyfanoutfailing"

      # The revocation blocks are saturated: over 1,000 authorities each had
      # over 100 spaces' revocations refused, so every remote authority's
      # credentials are refused (local ones keep working). Someone is
      # flooding revocations, or the caps are far too low (design: blocks
      # never fail open).
      - alert: VlpdsSpaceRevocationsSaturated
        expr: max by (instance) (vlpds_space_revocations_saturated{job="vlpds"}) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.instance }}: space revocation blocks are saturated; every remote space authority's credentials are refused"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsspacerevocationssaturated"

      # Over a quarter of space credential reads are refused, at over 0.5/s,
      # for 15 min (guess). Expired credentials are left out: clients fetch a
      # new one when theirs runs out.
      - alert: VlpdsSpaceCredentialRejectsHigh
        expr: >-
          sum by (instance) (rate(vlpds_space_credential_checks_total{job="vlpds",result!~"ok|expired"}[10m]))
            / sum by (instance) (rate(vlpds_space_credential_checks_total{job="vlpds"}[10m])) > 0.25
          and on (instance) sum by (instance) (rate(vlpds_space_credential_checks_total{job="vlpds",result!~"ok|expired"}[10m])) > 0.5
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} of space credential reads on {{ $labels.instance }} are refused"
          runbook_url: "https://github.com/jazware/vlpds/blob/main/ops/RUNBOOK.md#vlpdsspacecredentialrejectshigh"
